name: Scrape FantasyPros ROS Rankings

# Runs Tue/Thu/Sat at 13:07 America/Sao_Paulo (BRT, fixed UTC-3, no DST since
# 2019) = 16:07 UTC. Cron day-of-week: 2=Tue, 4=Thu, 6=Sat. Offset 7 minutes
# past the hour on purpose - GitHub's own scheduling guidance recommends
# avoiding the top of the hour, since that's when the shared Actions
# scheduler queue is busiest across every repo running a schedule, which is
# exactly when a run is most likely to be delayed.
#
# Even off the hour, GitHub does not guarantee scheduled workflows fire at
# the exact configured minute - a delay of minutes up to a few hours is
# documented, expected platform behavior (most common right after a
# schedule is first added, or under high scheduler load), not a bug in
# this workflow. See: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
on:
  schedule:
    - cron: "7 16 * * 2,4,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FantasyPros ROS scraper
        run: python scripts/scrape_fantasypros_ros.py

      - name: Capture dynasty value + roster snapshot
        run: python scripts/capture_value_snapshot.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fp_ros_ppr_latest.json data/value_history/
          if git diff --cached --quiet; then
            echo "No changes to commit - skipping."
          else
            git commit -m "Update FantasyPros ROS rankings + value/roster snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi
